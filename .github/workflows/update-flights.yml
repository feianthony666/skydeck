name: Update SkyDeck flight snapshot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch live flight snapshot
        run: node scripts/updateFlightSnapshot.mjs
      - name: Commit snapshot
        run: |
          git config user.name "SkyDeck Snapshot"
          git config user.email "skydeck-snapshot@users.noreply.github.com"
          git add public/flights/latest.json
          if git diff --cached --quiet; then
            echo "Snapshot unchanged"
          else
            git diff --cached --stat
            git commit -m "Update live flight snapshot"
            git push
          fi
      - name: Deploy updated snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
